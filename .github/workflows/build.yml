name: Build

on:
  push:
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: ubuntu-qt6
            os: ubuntu-latest
          - name: windows-qt6-msvc
            os: windows-latest
          - name: macos-qt6
            os: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Qt 6 (Ubuntu)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            cmake ninja-build \
            qt6-base-dev qt6-5compat-dev qt6-multimedia-dev \
            qt6-tools-dev qt6-tools-dev-tools \
            libgl1-mesa-dev

      - name: Install Qt 6 (Windows MSVC)
        if: runner.os == 'Windows'
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.3'
          host: windows
          target: desktop
          arch: win64_msvc2022_64
          modules: qt5compat qtmultimedia
          cache: true

      - name: Install Qt 6 (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install cmake qt@6
          echo "CMAKE_PREFIX_PATH=$(brew --prefix qt@6)" >> "$GITHUB_ENV"
          echo "$(brew --prefix qt@6)/bin" >> "$GITHUB_PATH"

      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Protocol self-check
        shell: bash
        run: |
          set -euo pipefail
          run_one() {
            local name="$1"
            for p in "build/${name}" "build/${name}.exe" "build/Release/${name}.exe"; do
              if [ -f "$p" ]; then
                "$p"
                return 0
              fi
            done
            echo "${name} not found"
            find build -name "${name}*" | head
            return 1
          }
          run_one qipmsgP1Check
          run_one qipmsgBackupCheck
          run_one qipmsgShareCheck
          run_one qipmsgCryptoCheck
          run_one qipmsgQueueCheck
          run_one qipmsgP2Check

      - name: Locate binary
        shell: bash
        run: |
          for p in build/qipmsg build/qipmsg.exe build/Release/qipmsg.exe; do
            if [ -f "$p" ]; then
              ls -l "$p"
              echo "BIN=$p" >> "$GITHUB_ENV"
              exit 0
            fi
          done
          echo "qipmsg binary not found under build/"
          find build -name 'qipmsg*' | head
          exit 1

      # install-qt-action puts Qt 6.8.3 MSVC2022 on PATH (QT_ROOT_DIR/bin).
      # windeployqt copies Qt6*.dll, platforms/, and other plugins next to the exe
      # so the zip runs on a machine without a system Qt install.
      - name: Deploy Qt runtime (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          if [ -n "${QT_ROOT_DIR:-}" ] && [ -x "${QT_ROOT_DIR}/bin/windeployqt.exe" ]; then
            WINDEPLOYQT="${QT_ROOT_DIR}/bin/windeployqt.exe"
          else
            WINDEPLOYQT="$(command -v windeployqt || command -v windeployqt.exe)"
          fi
          echo "Using $WINDEPLOYQT"
          "$WINDEPLOYQT" --version
          mkdir -p build/win-deploy
          cp -f "$BIN" build/win-deploy/qipmsg.exe
          "$WINDEPLOYQT" --release --compiler-runtime build/win-deploy/qipmsg.exe
          mkdir -p build/win-deploy/translations
          for d in build/Release/translations build/translations; do
            if [ -d "$d" ]; then
              cp -f "$d"/*.qm build/win-deploy/translations/ 2>/dev/null || true
            fi
          done
          ls -la build/win-deploy
          ls -la build/win-deploy/platforms
          test -f build/win-deploy/qipmsg.exe
          test -f build/win-deploy/Qt6Core.dll
          test -d build/win-deploy/platforms

      - name: Version and installer script check
        shell: bash
        run: |
          set -euo pipefail
          ver_h=$(sed -n 's/^#define VERSION[[:space:]]*"\([^"]*\)".*/\1/p' src/version.h)
          ver_cmake=$(sed -n 's/^project(qipmsg VERSION \([0-9.]*\).*/\1/p' CMakeLists.txt)
          ver_doc=$(sed -n 's/^当前版本：\*\*\([0-9.]*\)\*\*.*/\1/p' docs/README.md)
          echo "version.h=$ver_h cmake=$ver_cmake readme=$ver_doc"
          test -n "$ver_h"
          test "$ver_h" = "$ver_cmake"
          test "$ver_h" = "$ver_doc"
          test -f packaging/qipmsg.nsi
          grep -q '!ifndef VERSION' packaging/qipmsg.nsi
          grep -q '!ifndef DEPLOYDIR' packaging/qipmsg.nsi
          if grep -E 'OutFile "qipmsg-[0-9]' packaging/qipmsg.nsi; then
            echo "packaging/qipmsg.nsi hardcodes a version"
            exit 1
          fi

      - name: NSIS installer (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v makensis >/dev/null 2>&1; then
            choco install nsis -y --no-progress
            export PATH="/c/Program Files (x86)/NSIS:$PATH"
          fi
          command -v makensis
          ver=$(sed -n 's/^#define VERSION[[:space:]]*"\([^"]*\)".*/\1/p' src/version.h)
          deploy=$(cygpath -w "$PWD/build/win-deploy")
          mkdir -p build/win-setup
          out=$(cygpath -w "$PWD/build/win-setup/qipmsg-${ver}-setup.exe")
          makensis -DVERSION="$ver" -DDEPLOYDIR="$deploy" -DOUTFILE="$out" packaging/qipmsg.nsi
          test -f "build/win-setup/qipmsg-${ver}-setup.exe"

      - name: Upload installer (Windows)
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: qipmsg-windows-setup
          if-no-files-found: error
          path: build/win-setup/*.exe

      - name: Upload artifact (Windows)
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: qipmsg-${{ matrix.name }}
          if-no-files-found: error
          path: build/win-deploy/

      - name: Upload artifact
        if: runner.os != 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: qipmsg-${{ matrix.name }}
          if-no-files-found: error
          path: |
            ${{ env.BIN }}
            build/translations/
            build/Release/translations/
